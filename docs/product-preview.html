<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resolve Timeline Tool</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      background: #e8eaed;
      color: #1f2328;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      letter-spacing: 0;
    }
    .window {
      width: 720px;
      height: 462px;
      overflow: hidden;
      border: 1px solid #aeb3ba;
      border-radius: 8px;
      background: #f6f6f6;
      box-shadow: 0 18px 50px rgba(20, 24, 30, 0.22);
    }
    .titlebar {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 32px;
      border-bottom: 1px solid #c8cbd0;
      background: #ececec;
      color: #24272b;
      font-size: 13px;
      font-weight: 600;
    }
    .traffic {
      position: absolute;
      left: 12px;
      display: flex;
      gap: 8px;
    }
    .traffic span { width: 12px; height: 12px; border-radius: 50%; }
    .close { background: #ff5f57; border: 1px solid #e0443e; }
    .min { background: #ffbd2e; border: 1px solid #dea123; }
    .max { background: #28c840; border: 1px solid #1eac35; }
    .content { padding: 16px; }
    .form {
      display: grid;
      grid-template-columns: 130px minmax(0, 1fr) 138px;
      gap: 8px;
      align-items: center;
    }
    label { white-space: nowrap; }
    input, .spinbox {
      height: 25px;
      border: 1px solid #aeb3ba;
      border-radius: 5px;
      background: white;
      color: #30343a;
      font: inherit;
      padding: 3px 8px;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.06);
    }
    input { width: 100%; }
    button {
      height: 25px;
      border: 1px solid #a7abb0;
      border-radius: 5px;
      background: linear-gradient(#ffffff, #e8e8e8);
      color: #1f2328;
      font: inherit;
      padding: 2px 12px;
      white-space: nowrap;
    }
    .button-pair { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
    .duration { display: flex; align-items: center; gap: 8px; }
    .spinbox { width: 82px; position: relative; }
    .spinbox::after { content: "6.0"; }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 18px 0 10px;
    }
    .actions button { height: 29px; }
    .progress {
      height: 12px;
      overflow: hidden;
      border: 1px solid #aeb3ba;
      border-radius: 5px;
      background: #e1e2e4;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.08);
    }
    .progress-fill {
      width: 68%;
      height: 100%;
      background: #1976d2;
    }
    .status { margin: 4px 0 10px; color: #353a40; }
    .log {
      height: 180px;
      overflow: hidden;
      border: 1px solid #aeb3ba;
      background: white;
      padding: 9px 10px;
      color: #2e3338;
      font-family: Menlo, Monaco, monospace;
      font-size: 11px;
      line-height: 1.45;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <main class="window" aria-label="Resolve Timeline Tool">
    <header class="titlebar">
      <div class="traffic" aria-hidden="true"><span class="close"></span><span class="min"></span><span class="max"></span></div>
      Resolve Timeline Tool
    </header>
    <section class="content">
      <div class="form">
        <label>Dossier source</label>
        <input value="/Volumes/VIDEO/Rushs_Voyage" readonly>
        <button>Parcourir</button>

        <label>Style .md</label>
        <input value="/Documents/styles/style_voyage.md" readonly>
        <div class="button-pair"><button>Parcourir</button><button>Ouvrir</button></div>

        <label>Sortie</label>
        <input value="/Volumes/VIDEO/Rushs_Voyage/_resolve_timeline_exports" readonly>
        <button>Parcourir</button>

        <label>Durée max segment</label>
        <div class="duration"><div class="spinbox"></div><span>secondes</span></div>
        <span></span>
      </div>

      <div class="actions">
        <button>Générer timeline</button>
        <button>Relancer après modification .md</button>
      </div>

      <div class="progress"><div class="progress-fill"></div></div>
      <div class="status">Analyse audio et synchronisation des cuts sur les beats...</div>
      <div class="log">Les exports EDL et FCPXML seront créés dans le dossier de sortie.
Traitement lancé. Le style Markdown est relu depuis le disque.
Rushs détectés : 42 clips, répartis sur 3 journées.
Plans drone identifiés : 7.</div>
    </section>
  </main>
</body>
</html>
